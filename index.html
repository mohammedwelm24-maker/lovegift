<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>رسالة صغيرة ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="hearts" aria-hidden="true"></div>
    <div id="sparkles" aria-hidden="true"></div>

    <!-- شاشة كلمة السر -->
    <section id="lock-screen" class="screen active">

    <div class="env bob" aria-hidden="true">
        <div class="paper"></div>
        <div class="front"></div>
        <div class="flap"></div>
        <div class="seal">❤️</div>
    </div>

    <h1 class="title">عندك رسالة صغيرة من حد بيحبك ❤️</h1>

    <form id="lock-form" autocomplete="off">
        <input
        id="password"
        type="password"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="اكتبي كلمة السر هنا"
        aria-label="كلمة السر">

        <button type="submit" class="btn">افتحي هديتك 💌</button>
    </form>

    <p id="error" class="error" role="alert"></p>

    </section>

    <!-- صفحة المفاجأة -->
    <section id="surprise-screen" class="screen">

    <div id="env-stage">
        <div class="env" id="big-env" aria-hidden="true">
        <div class="paper"></div>
        <div class="front"></div>
        <div class="flap"></div>
        <div class="seal">❤️</div>
        </div>
    </div>

    <article id="card" class="card">
        <p id="message" class="message" aria-live="polite"></p>
        <p id="second" class="second"></p>

        <div class="actions">
        <button id="btn-surprise" class="btn">اضغطي هنا للمفاجأة ❤️</button>
        <button id="btn-replay" class="btn ghost">أعيدي الحركة 🔁</button>
        <button id="btn-music" class="btn ghost">🎵 شغّلي الموسيقى</button>
        </div>
    </article>

    </section>

    <footer class="footer">صُنعت بحب ❤️</footer>

    <audio id="music" src="music.mp3." loop preload="none"></audio>

    <script src="script.js"></script>

</body>

</html>
